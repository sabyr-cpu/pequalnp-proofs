name: open-L-meta-2774
on:
  workflow_dispatch:
jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --repo brilliant-hq/pequalnp-proofs --head sabyr-cpu:L-meta-2774 --base main --title L-meta-2774 --body "" || \
          gh pr view --repo brilliant-hq/pequalnp-proofs sabyr-cpu:L-meta-2774 --json url -q .url
